<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>印即得彩卡报价工具</title>
<meta name="description" content="印即得彩卡报价工具V1">
<style>
:root{
  --primary:#2563eb;
  --primary2:#3b82f6;
  --primaryD:#1e40af;
  --accent:#e07b39;
  --dark:#1e293b;
  --sub:#64748b;
  --line:#dbeafe;
  --bg:#f1f5f9;
  --card:#ffffff;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--dark);line-height:1.5;min-height:100vh;padding:16px}
.wrap{max-width:640px;width:100%;margin:0 auto}

/* 头部 */
header{background:linear-gradient(135deg,var(--primaryD) 0%,var(--primary) 55%,var(--primary2) 100%);color:#fff;border-radius:var(--radius);padding:16px 20px;text-align:center;margin-bottom:12px;box-shadow:0 3px 12px rgba(37,99,235,.3)}
header h1{font-size:22px;font-weight:700;letter-spacing:1px;color:#fff;display:inline}
header .tag{font-size:14px;font-weight:600;color:rgba(255,255,255,.9);margin-left:6px}

/* 卡片通用 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.06);padding:10px;margin-bottom:8px}
.card-title{display:inline-block;background:var(--primary);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px;margin-bottom:8px}

/* 基础参数 */
.param-row{margin-bottom:8px}
.param-row:last-child{margin-bottom:0}
.param-label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px;font-weight:500}
.param-input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:17px;background:#fff;color:var(--dark);font-weight:700;transition:border-color .2s,box-shadow .2s}
.param-input::placeholder{font-size:15px;color:#94a3b8;font-weight:500}
.param-input::-webkit-input-placeholder{font-size:15px;color:#94a3b8;font-weight:500}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 自定义下拉 */
.preset-wrap{position:relative}
.preset-arrow{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);font-size:10px;pointer-events:auto;z-index:2}
.preset-wrap .param-input{padding-right:32px}
.preset-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1.5px solid var(--line);border-radius:9px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:10;max-height:180px;overflow-y:auto;display:none}
.preset-list.open{display:block}
.preset-item{padding:9px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.preset-item:last-child{border-bottom:none}
.preset-item:hover{background:#eff6ff;color:var(--primary);font-weight:600}

/* 计算公式 */
.formula-card{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.formula-card .f-title{font-size:12px;font-weight:700;color:var(--primaryD);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.formula-card .f-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary)}
.formula-card .f-line{font-size:12px;color:#374151;line-height:1.7}
.formula-card .f-line code{background:rgba(37,99,235,.1);padding:1px 5px;border-radius:4px;font-family:inherit;color:var(--primary);font-weight:600}
.formula-card .f-note{font-size:11px;color:var(--sub);margin-top:5px;padding-top:5px;border-top:1px dashed #93c5fd}

/* 报价明细 */
.detail-head{display:grid;grid-template-columns:28px 132px 54px 64px 64px 82px 24px;justify-content:space-between;gap:6px;padding:0 6px 8px;font-size:12px;color:var(--sub);font-weight:600}
.detail-head > *{min-width:0}
.detail-head .c{text-align:center;white-space:nowrap}
.detail-head .r{text-align:right;white-space:nowrap}

.detail-row{display:grid;grid-template-columns:28px 132px 54px 64px 64px 82px 24px;justify-content:space-between;gap:6px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;margin-bottom:6px;transition:border-color .2s,box-shadow .2s}
.detail-row > *{min-width:0}
.detail-row:hover{border-color:#93c5fd;box-shadow:0 2px 8px rgba(37,99,235,.06)}
.detail-row .idx{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#10b981,#34d399);color:#fff;font-size:12px;font-weight:700;border-radius:8px;text-align:center;margin:0 auto}
.detail-row .dim{display:flex;align-items:center;gap:4px;min-width:0}
.detail-row .dim input{flex:1;min-width:0;width:0;max-width:55px;padding:8px 4px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;text-align:center;font-weight:700;transition:border-color .2s}
.detail-row .dim input:focus{outline:none;border-color:var(--primary2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.detail-row .dim .x{color:var(--sub);font-size:12px;font-weight:500;flex-shrink:0;padding:0 2px}
.detail-row .qty input{width:100%;min-width:0;padding:8px 4px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;text-align:center;font-weight:700;transition:border-color .2s}
.detail-row .qty input:focus{outline:none;border-color:var(--primary2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.detail-row .price{text-align:right;font-size:13px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;white-space:nowrap}
.detail-row .film{text-align:right;font-size:13px;font-weight:700;color:#64748b;font-variant-numeric:tabular-nums;white-space:nowrap}
.detail-row .sub{text-align:right;font-size:15px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.detail-row .del{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:#fef2f2;border:1.5px solid #fecaca;color:#dc2626;border-radius:50%;font-size:14px;cursor:pointer;transition:background .15s}
.detail-row .del:hover{background:#fee2e2}

.add-btn{width:100%;padding:9px;background:#fff;border:1.5px dashed #93c5fd;border-radius:9px;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.add-btn:hover{border-color:var(--primary);color:var(--primary);background:#eff6ff}

/* 合计 */
.total-card{background:var(--card);border-radius:var(--radius);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1.5px solid var(--line);margin-bottom:8px}
.total-card .lbl{color:var(--dark);font-size:18px;font-weight:700}
.total-card .num{color:var(--dark);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.total-card .num.empty{color:#94a3b8;font-size:22px;font-weight:700}

/* 操作 */
.action-bar{display:flex;gap:8px;margin-top:4px}
.action-bar button{flex:1;padding:11px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s,box-shadow .2s,background .2s}
.action-bar button:active{transform:scale(.98)}
.btn-copy{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.3)}
.btn-copy:hover{background:var(--primary2)}
.btn-copied{background:#1e40af !important;color:#fff !important;box-shadow:0 3px 10px rgba(30,64,175,.4) !important}
.btn-warn{color:#facc15 !important}

footer{text-align:center;color:#94a3b8;font-size:12px;padding:12px 0 6px}

/* 手机端 */
@media(max-width:520px){
  body{padding:10px}
  header{padding:12px 16px;margin-bottom:10px}
  header h1{font-size:18px}
  .card{padding:10px;margin-bottom:6px}
  .param-grid{grid-template-columns:1fr}
  .detail-head{grid-template-columns:16px 84px 28px 44px 44px 56px 16px;gap:3px;padding:0 4px 6px;font-size:10px}
  .detail-row{grid-template-columns:16px 84px 28px 44px 44px 56px 16px;gap:3px;padding:6px 4px;margin-bottom:5px}
  .detail-row .idx{width:18px;height:18px;font-size:11px;border-radius:6px}
  .detail-row .dim{gap:2px}
  .detail-row .dim input{max-width:36px;padding:6px 2px;font-size:13px;font-weight:700}
  .detail-row .dim .x{font-size:10px;padding:0 1px}
  .detail-row .qty input{padding:6px 2px;font-size:13px;font-weight:700}
  .detail-row .price{font-size:11.5px}
  .detail-row .film{font-size:11.5px}
  .detail-row .sub{font-size:13.5px}
  .detail-row .del{width:16px;height:16px;font-size:11px;min-width:16px}
  .total-card{padding:8px 12px;margin-bottom:6px}
  .total-card .lbl{font-size:16px}
  .total-card .num{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>印即得彩卡报价工具</h1>
  <span class="tag">V1</span>
</header>

<div class="card">
  <span class="card-title">基础参数</span>
  <div class="param-grid">
    <div class="param-row">
      <label class="param-label">克重（G）</label>
      <div class="preset-wrap">
        <input type="text" class="param-input" id="gsm" value="250G" placeholder="如 250G">
        <div class="preset-arrow">▼</div>
        <div class="preset-list" data-target="gsm">
          <div class="preset-item">250G</div>
          <div class="preset-item">300G</div>
        </div>
      </div>
    </div>
    <div class="param-row">
      <label class="param-label">纸张类型</label>
      <div class="preset-wrap">
        <input type="text" class="param-input" id="paperType" value="单卡纸" placeholder="如 单卡纸">
        <div class="preset-arrow">▼</div>
        <div class="preset-list" data-target="paperType">
          <div class="preset-item">单卡纸</div>
          <div class="preset-item">铜版纸</div>
        </div>
      </div>
    </div>
    <div class="param-row">
      <label class="param-label">吨价（元）</label>
      <input type="number" class="param-input" id="ton" value="4200" min="200" max="20000" step="1">
    </div>
    <div class="param-row">
      <label class="param-label">上机费（元）</label>
      <input type="number" class="param-input" id="setup" value="140" min="0" max="500" step="1">
    </div>
    <div class="param-row">
      <label class="param-label">出数（张）</label>
      <input type="number" class="param-input" id="free" value="50" min="0" max="200" step="1">
    </div>
    <div class="param-row">
      <label class="param-label">覆膜（元/m²）</label>
      <input type="number" class="param-input" id="film" value="0.4" min="0" max="10" step="0.01">
    </div>
  </div>
</div>

<div class="formula-card">
  <div class="f-title">计算公式</div>
  <div class="f-line">单张纸价 = <code>(长÷1000)</code> × <code>(宽÷1000)</code> × <code>(克重÷1000)</code> × 吨价 ÷ 1000</div>
  <div class="f-line">单张覆膜费 = <code>(长÷1000)</code> × <code>(宽÷1000)</code> × 覆膜单价</div>
  <div class="f-line">小计 = <code>(单张纸价 + 单张覆膜费)</code> × <code>(数量 + 出数)</code> + 上机费 − 出数 × 单张覆膜费</div>
  <div class="f-note">单位换算：尺寸 mm→m、克重 g/m²→kg/m²、重量 kg→吨、覆膜 元/m²</div>
</div>

<div class="card">
  <span class="card-title">报价明细</span>
  <div class="detail-head">
    <div class="c">#</div>
    <div class="c">尺寸 (mm)</div>
    <div class="c">数量</div>
    <div class="r">单张纸价</div>
    <div class="r">单张覆膜</div>
    <div class="r">小计</div>
    <div></div>
  </div>
  <div id="rows"></div>
  <button class="add-btn" id="btnAdd">＋ 添加一行</button>
</div>

<div class="total-card">
  <span class="lbl">合计</span>
  <span class="num" id="total">¥0.00</span>
</div>

<div class="action-bar">
  <button class="btn-copy" id="btnCopy">复制报价</button>
</div>

<footer>copyright©OldK</footer>
</div>

<script>
function $(id){ return document.getElementById(id); }
function v(id){ return parseFloat($(id).value) || 0; }
function fmt(n){ return '¥' + n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmt3(n){ return n.toLocaleString('zh-CN',{minimumFractionDigits:3,maximumFractionDigits:3}); }

function parseGram(str){
  var m = str.match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}

function renumber(){
  document.querySelectorAll('.detail-row .idx').forEach(function(el,i){ el.textContent = i+1; });
}

function addRow(len, wid, qty){
  var div = document.createElement('div');
  div.className = 'detail-row';
  div.innerHTML =
    '<span class="idx"></span>' +
    '<div class="dim">' +
      '<input type="number" class="rl" value="' + (len||'') + '" min="10" max="1300" step="1" placeholder="长">' +
      '<span class="x">×</span>' +
      '<input type="number" class="rw" value="' + (wid||'') + '" min="10" max="1300" step="1" placeholder="宽">' +
    '</div>' +
    '<div class="qty"><input type="number" class="rq" value="' + (qty||'') + '" min="1" step="1" placeholder="数量"></div>' +
    '<div class="price">--</div>' +
    '<div class="film">--</div>' +
    '<div class="sub">--</div>' +
    '<button class="del" title="删除">×</button>';
  $('rows').appendChild(div);
  div.querySelector('.del').addEventListener('click', function(){
    if(document.querySelectorAll('.detail-row').length > 1){ div.remove(); renumber(); calc(); }
    else { alert('至少保留一行'); }
  });
  div.querySelectorAll('input').forEach(function(inp){
    inp.addEventListener('input', function(){
      // 数量不允许输入小数
      if(inp.classList.contains('rq') && /\./.test(inp.value)) inp.value = inp.value.replace(/\.\d*$/, '');
      calc();
    });
    inp.addEventListener('blur', function(){
      if(inp.value === '') return; // 留空，复制时提示填写
      var n = parseFloat(inp.value);
      if(inp.classList.contains('rq')){
        if(isNaN(n) || n <= 0) inp.value = 1;
        else inp.value = Math.max(1, Math.round(n));
      } else {
        if(isNaN(n)) n = 10;
        inp.value = Math.min(1300, Math.max(10, n));
      }
      calc();
    });
  });
  renumber();
  calc();
  return div;
}

function calc(){
  var weight = parseGram($('gsm').value);
  var ton = v('ton'), setup = v('setup'), free = v('free'), film = v('film');
  var grand = 0, validRows = 0, rowsData = [];

  document.querySelectorAll('.detail-row').forEach(function(row){
    var rl = row.querySelector('.rl'), rw = row.querySelector('.rw'), rq = row.querySelector('.rq');
    var len = parseFloat(rl.value) || 0;
    var wid = parseFloat(rw.value) || 0;
    var qty = parseFloat(rq.value) || 0;

    if(!rl.value || !rw.value || !rq.value || len <= 0 || wid <= 0 || qty <= 0) {
      row.querySelector('.price').textContent = '—';
      row.querySelector('.film').textContent = '—';
      row.querySelector('.sub').textContent = '—';
      return;
    }

    validRows++;

    var areaM = (len / 1000) * (wid / 1000);
    var kgPerSheet = areaM * (weight / 1000);
    var sheet = kgPerSheet * ton / 1000;
    var filmPerSheet = areaM * film;
    var sub = (sheet + filmPerSheet) * (qty + free) + setup - free * filmPerSheet;
    grand += sub;

    row.querySelector('.price').textContent = fmt3(sheet);
    row.querySelector('.film').textContent = fmt3(filmPerSheet);
    row.querySelector('.sub').textContent = fmt(sub);
    rowsData.push({len:len, wid:wid, qty:qty, sheet:sheet, sub:sub});
  });

  if(validRows === 0) {
    $('total').textContent = '—';
    $('total').classList.add('empty');
  } else {
    $('total').textContent = fmt(grand);
    $('total').classList.remove('empty');
  }

  var now = new Date();
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  var dateStr = now.getFullYear() + '-' + p(now.getMonth()+1) + '-' + p(now.getDate()) +
    ' ' + p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds());

  var lines = rowsData.map(function(r,i){
    return (i+1) + '. ' + r.len + '×' + r.wid + 'mm｜数量 ' + r.qty + '｜单张纸价 ' + r.sheet.toFixed(3) + '元｜小计 ' + r.sub.toFixed(2) + '元';
  });
  window.__text =
    '纸张：' + $('gsm').value + ' ' + $('paperType').value + '｜吨价 ' + ton + '元｜上机费 ' + setup + '元｜出数 ' + free + '张｜覆膜 ' + film + '元/m²\n' +
    '\n' +
    lines.join('\n') + '\n' +
    '———————————————————\n' +
    '合计：' + grand.toFixed(2) + ' 元\n' +
    '印即得彩卡报价工具V1｜copyright©OldK\n' +
    dateStr;
}

$('btnAdd').addEventListener('click', function(){ addRow(); });

$('btnCopy').addEventListener('click', function(){
  var btn = this;
  var empty = false;
  document.querySelectorAll('.detail-row').forEach(function(row){
    if(!row.querySelector('.rl').value || !row.querySelector('.rw').value || !row.querySelector('.rq').value) empty = true;
  });
  if(empty){
    btn.textContent = '请先填写明细';
    btn.classList.add('btn-warn');
    setTimeout(function(){
      btn.textContent = '复制报价';
      btn.classList.remove('btn-warn');
    }, 2000);
    return;
  }
  var t = window.__text || '';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){
      btn.textContent = '已复制';
      btn.classList.add('btn-copied');
      setTimeout(function(){
        btn.textContent = '复制报价';
        btn.classList.remove('btn-copied');
      }, 2000);
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = '已复制';
    btn.classList.add('btn-copied');
    setTimeout(function(){
      btn.textContent = '复制报价';
      btn.classList.remove('btn-copied');
    }, 2000);
  }
});

['gsm','paperType','ton','setup','free','film'].forEach(function(id){
  $(id).addEventListener('input', calc);
  $(id).addEventListener('change', calc);
});

// 克重手动输入后自动补上单位 G，整数，限制 60-600
$('gsm').addEventListener('blur', function(){
  var m = this.value.match(/(\d+(?:\.\d+)?)/);
  var n = m ? parseFloat(m[1]) : 250;
  n = Math.min(600, Math.max(60, Math.round(n)));
  this.value = n + 'G';
  calc();
});

// 纸张类型不可为空，空则回填默认
$('paperType').addEventListener('blur', function(){
  if(!this.value.trim()) this.value = '单卡纸';
});

// 数字输入范围限制（失焦时钳制，isInt 为真时取整）
function bindClamp(id, min, max, def, isInt){
  $(id).addEventListener('blur', function(){
    var n = parseFloat(this.value);
    if(isNaN(n)) n = def;
    n = Math.min(max, Math.max(min, n));
    if(isInt) n = Math.round(n);
    this.value = n;
    calc();
  });
}
bindClamp('ton', 200, 20000, 4200, true);
bindClamp('setup', 0, 500, 140, true);
bindClamp('free', 0, 200, 50, true);
bindClamp('film', 0, 10, 0.4, false);

// 克重/吨价/上机费/出数：输入时禁止小数点
['gsm','ton','setup','free'].forEach(function(id){
  $(id).addEventListener('input', function(){
    if(/\./.test(this.value)) this.value = this.value.replace(/\.\d*$/, '');
  });
});

// 自定义下拉组件
document.querySelectorAll('.preset-wrap').forEach(function(wrap){
  var input = wrap.querySelector('input');
  var arrow = wrap.querySelector('.preset-arrow');
  var list = wrap.querySelector('.preset-list');

  arrow.addEventListener('click', function(e){
    e.stopPropagation();
    var isOpen = list.classList.contains('open');
    document.querySelectorAll('.preset-list.open').forEach(function(l){ l.classList.remove('open'); });
    if(!isOpen) list.classList.add('open');
  });

  input.addEventListener('focus', function(){
    document.querySelectorAll('.preset-list.open').forEach(function(l){ l.classList.remove('open'); });
  });

  list.querySelectorAll('.preset-item').forEach(function(item){
    item.addEventListener('click', function(e){
      e.stopPropagation();
      input.value = item.textContent;
      list.classList.remove('open');
      calc();
    });
  });
});

document.addEventListener('click', function(){
  document.querySelectorAll('.preset-list.open').forEach(function(l){ l.classList.remove('open'); });
});

addRow();
</script>
</body>
</html>
